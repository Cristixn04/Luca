services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=luca_rag
      - POSTGRES_USER=${LUCA_RAG_DB_USER:-luca}
      - POSTGRES_PASSWORD=${LUCA_RAG_DB_PASSWORD:-luca_dev_password}
    ports:
      - "127.0.0.1:${LUCA_RAG_DB_PORT:-5436}:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LUCA_RAG_DB_USER:-luca} -d luca_rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rag-api:
    build:
      context: ./services/rag-api
      dockerfile: Dockerfile
    env_file:
      - path: ./services/rag-api/.env
        required: false
    environment:
      - LUCA_RAG_DB_URL=jdbc:postgresql://postgres:5432/luca_rag
      - LUCA_RAG_DB_USER=${LUCA_RAG_DB_USER:-luca}
      - LUCA_RAG_DB_PASSWORD=${LUCA_RAG_DB_PASSWORD:-luca_dev_password}
      - LUCA_RAG_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:8090
    ports:
      - "127.0.0.1:${LUCA_RAG_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    env_file:
      - path: ./services/api/.env
        required: false
    environment:
      - LUCA_ALLOWED_ORIGINS=http://localhost:8090
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${LUCA_WEB_PORT:-8090}:8080"
    depends_on:
      - api
      - rag-api
    restart: unless-stopped

volumes:
  rag_pgdata:
